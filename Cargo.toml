[workspace]
members = [
    "crates/ci-core",
    "crates/ci-python",
    "crates/cir/src/rust",
    "crates/ci-js",
]
resolver = "2"

[workspace.dependencies]
anyhow = "1"
ndarray = "0.16"
statrs = { version = "0.18.0"}


# Development dependencies (testing, benchmarking)
criterion = "0.5"
proptest = "1.0"

# Linting/development
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
