[workspace]
members = [
    "crates/citest",
    "crates/citest-python",
    "crates/citest-js",
]
resolver = "2"

[workspace.dependencies]
statrs = { version = "0.18.0", default-features = false }

# Linting/development
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
lto = true
codegen-units = 1
