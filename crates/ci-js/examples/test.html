<!doctype html>
<html>
  <body>
    <pre id="result"></pre>
    <script type="module">
      import init, {
        pearson_correlation_test,
        chi_squared_test,
        cressie_read_test,
        log_likelihood_test,
        freeman_tukey_test,
        modified_likelihood_test,
        pearson_equivalence_test,
      } from "../pkg/ci_js.js";

      await init();

      try {
        const result = pearson_correlation_test(
          new Float64Array([1, 1, 1, 1, 1]),
          5,

          new Float64Array([1, 2, 3, 4, 5]),
          new Float64Array([1, 2, 3, 4, 5]),
