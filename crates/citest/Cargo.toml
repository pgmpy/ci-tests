[package]
name = "citest"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Conditional Independence Testing"
repository.workspace = true
keywords = ["statistics", "causal-inference", "conditional-independence"]
categories = ["science"]

# `tests/golden.rs` reads the repository-root fixture, which is not part of the
# packaged crate; publishing the test without its fixture would ship a test that
# cannot run. Consumers do not need the development parity suite.
exclude = ["tests/**"]

[dependencies]
statrs = { workspace = true }
thiserror = "2"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
