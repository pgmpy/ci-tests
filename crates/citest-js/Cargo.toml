[package]
name = "citest-js"
version = "0.1.0"
edition = "2021"
authors = ["Ankur Ankan <ankurankan@gmail.com>"]
license = "MIT"
description = "wasm-pack bindings for Conditional Independence Testing"
repository = "https://github.com/pgmpy/ci-tests"
publish = false

[lib]
crate-type = ["cdylib"]

# wasm-pack tooling configuration (NOT a cargo `[profile.*]`). The redesigned
# core emits modern wasm (bulk-memory) that pre-0.110 `wasm-opt` cannot parse;
# wasm-opt only shrinks the binary, so disabling it keeps the build portable
# without affecting correctness. Re-enable once a newer wasm-opt is guaranteed.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false

[dependencies]
citest = { path = "../citest" }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"

[lints]
workspace = true
