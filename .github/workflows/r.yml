name: R CI

on:
  push:
    branches: [master, development]
    paths:
      - 'crates/cir/**'
      - 'crates/ci-core/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/r.yml'
  pull_request:
    paths:
      - 'crates/cir/**'
      - 'crates/ci-core/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/r.yml'

concurrency:
  group: r-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  r-lint:
    name: R Lint and Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - name: Install lintr and styler
        run: install.packages(c("lintr", "styler"))
        shell: Rscript {0}

      - name: Check R formatting
        working-directory: crates/cir
        run: styler::style_pkg(dry = "fail")
        shell: Rscript {0}

      - name: Lint R code
        working-directory: crates/cir
        run: |
          lints <- lintr::lint_package()
          print(lints)
          if (length(lints) > 0) quit(status = 1)
        shell: Rscript {0}

  r-test:
    name: R Package Tests
    needs: [r-lint]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install R package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: crates/cir
          extra-packages: any::devtools, any::rextendr

      - name: Generate Makevars and R wrappers
        working-directory: crates/cir
        run: rextendr::document()
        shell: Rscript {0}

      - name: Run R tests
        working-directory: crates/cir
        run: devtools::test(reporter = "summary")
        shell: Rscript {0}
