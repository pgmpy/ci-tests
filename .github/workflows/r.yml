name: R CI

# Toolchain: R + rextendr (which compiles the embedded Rust crate), devtools,
# testthat, and jsonlite. rextendr::document() regenerates the extendr wrappers,
# then the workflow tests and checks the built source package archive.
#
# We use r-lib/actions/setup-r (a standard CRAN R), which does NOT require the
# LD_LIBRARY_PATH workaround. (A *conda* R does: there you must export
# LD_LIBRARY_PATH=$(Rscript -e 'cat(R.home("lib"))') so the embedded Rust can
# link libR — not needed with the standard action below.)
#
# Commands are run from the repo root with the package path passed explicitly.

on:
  push:
    branches: [main]
    paths:
      - 'crates/citest-r/**'
      - 'crates/citest/**'
      - 'tests/fixtures/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/r.yml'
  pull_request:
    paths:
      - 'crates/citest-r/**'
      - 'crates/citest/**'
      - 'tests/fixtures/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/r.yml'

concurrency:
  group: r-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  r-lint:
    name: R Lint and Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - name: Install lintr and styler
        run: install.packages(c("lintr", "styler"))
        shell: Rscript {0}

      - name: Check R formatting
        working-directory: crates/citest-r
        run: |
          files <- setdiff(list.files("R", pattern = "[.]R$", full.names = TRUE), "R/extendr-wrappers.R")
          styler::style_file(files, dry = "fail", include_roxygen_examples = FALSE)
        shell: Rscript {0}

      - name: Lint R code
        working-directory: crates/citest-r
        run: |
          lints <- lintr::lint_package()
          print(lints)
          if (length(lints) > 0) quit(status = 1)
        shell: Rscript {0}

  r-test:
    name: R Package Tests
    needs: [r-lint]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - name: Install Rust MSRV
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.81.0

      - name: Install Windows GNU Rust target
        if: runner.os == 'Windows'
        run: rustup target add x86_64-pc-windows-gnu

      - uses: Swatinem/rust-cache@v2

      # The sync tool uses tomllib, so it needs Python 3.11+; the runner's
      # default python is not guaranteed to satisfy that.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check packaged source and fixture drift
        run: python crates/citest-r/tools/sync_package_assets.py --check

      # inst/AUTHORS is generated from the vendor archive, so a crate cannot
      # enter the bundle without being attributed. CRAN requires this.
      - name: Check bundled-crate attribution is current
        run: python crates/citest-r/tools/generate_authors.py --check

      # jsonlite is declared in Suggests for the golden suite; install it
      # alongside devtools/rextendr/testthat.
      - name: Install R package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: crates/citest-r
          extra-packages: any::devtools, any::rextendr, any::testthat, any::jsonlite

      - name: Generate Makevars and R wrappers
        run: rextendr::document("crates/citest-r")
        shell: Rscript {0}

      - name: Run R tests
        run: devtools::test("crates/citest-r", reporter = "summary")
        shell: Rscript {0}

      - name: Build and check source package
        run: |
          archive <- devtools::build(
            "crates/citest-r",
            path = tempdir(),
            manual = FALSE,
            vignettes = FALSE
          )
          message("Checking built source archive: ", archive)
          devtools::check_built(
            archive,
            cran = TRUE,
            manual = FALSE,
            args = "--no-manual",
            error_on = "warning"
          )
        shell: Rscript {0}
