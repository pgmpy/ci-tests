name: Rust CI

# NOTE: The build/test/lint commands below were verified by running them locally
# against this branch's toolchain. They are NOT exercised on GitHub Actions until
# this workflow runs there, so the exact runner setup (toolchain versions, OS
# package availability) may still need tweaks.
#
# The workspace is no longer built/tested as a single step: the binding crates
# (citest / citest-r / citest-js) each need their own non-cargo toolchain (maturin,
# rextendr/R, wasm-pack) and are covered by python.yml / r.yml / js.yml. This
# workflow builds and gates only the pure-Rust core crate (citest), whose tests
# include the 80-case shared golden parity fixture.

on:
  push:
    branches: [main]
    paths:
      - 'crates/citest/**'
      - 'crates/citest-python/**'
      - 'crates/citest-r/**'
      - 'crates/citest-js/**'
      - 'tests/fixtures/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/rust.yml'
  pull_request:
    paths:
      - 'crates/citest/**'
      - 'crates/citest-python/**'
      - 'crates/citest-r/**'
      - 'crates/citest-js/**'
      - 'tests/fixtures/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/rust.yml'

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  rust_fmt:
    name: Rust Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      # Verified locally: `cargo fmt --all -- --check`
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Rust Clippy Lints (citest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # Verified locally: `cargo clippy -p citest --all-targets -- -D warnings`.
      # Scoped to citest so this job needs no Python/R/wasm toolchain; the
      # binding crates are linted by their own workflows.
      - name: Run Clippy
        run: cargo clippy -p citest --all-targets -- -D warnings

  rust_test:
    name: Rust Tests (citest)
    needs: [rust_fmt, clippy]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable]
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test -p citest --verbose
