name: Python CI

# NOTE: The build/test commands below were verified by running them locally
# against this branch. They are NOT exercised on GitHub Actions until this
# workflow runs there, so the exact runner setup may still need tweaks.
#
# The bindings are built with maturin. On a Python newer than the installed
# PyO3 supports, set PYO3_USE_ABI3_FORWARD_COMPATIBILITY=1 (the crate already
# enables the `abi3-py310` feature, so a single abi3 wheel covers 3.10+). On CI
# we pin a supported Python (3.11-3.13) where that env var is not needed.
#
# The redesign removed the generated stubs / stub_gen binary, so there is no
# longer a "stubs up-to-date" job; the checked-in .pyi is maintained by hand.

on:
  push:
    branches: [main]
    paths:
      - 'crates/citest-python/**'
      - 'crates/citest/**'
      - 'crates/citest-r/**'
      - 'crates/citest-js/Cargo.toml'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/python.yml'
      - '.github/workflows/js.yml'
      - '.github/workflows/r.yml'
  pull_request:
    paths:
      - 'crates/citest-python/**'
      - 'crates/citest/**'
      - 'crates/citest-r/**'
      - 'crates/citest-js/Cargo.toml'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/python.yml'
      - '.github/workflows/js.yml'
      - '.github/workflows/r.yml'

concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      # Verified locally: `ruff format --check .` / `ruff check .` in crates/citest-python.
      - name: Check formatting
        working-directory: crates/citest-python
        run: ruff format --check .

      - name: Lint
        working-directory: crates/citest-python
        run: ruff check .

  golden-fixture:
    name: Golden Fixture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fixture dependencies
        run: pip install pytest -r tests/fixtures/requirements.txt

      # `pytest tests` asserts both committed fixture copies match the
      # generator and that --check never writes, so a separate CLI invocation
      # would only repeat it.
      - name: Test fixture tooling and fixture currency
        run: pytest tests

  pgmpy-parity:
    name: pgmpy Parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # pgmpy is pinned to a commit, so this is deterministic: it fails only
      # when a change here diverges from the reference implementation, not
      # when pgmpy moves.
      - name: Install pinned pgmpy
        run: pip install -r tests/fixtures/requirements-pgmpy.txt

      # Exits non-zero only on real divergence in shared semantics. Cases
      # pgmpy cannot express, and known intentional differences, are reported
      # and do not fail.
      - name: Compare against pgmpy
        run: python tests/fixtures/check_pgmpy_parity.py

  # The extension is abi3, so ONE wheel per OS runs on every supported
  # interpreter. Building inside the 3x3 test matrix compiled the same Rust
  # nine times to produce three distinct artifacts.
  build-wheel:
    name: Build Wheel
    needs: [golden-fixture, python-lint]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build abi3 wheel
        run: pipx run maturin build --release --manifest-path crates/citest-python/Cargo.toml --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: dist/*.whl

  python-test:
    name: Python Tests
    needs: [build-wheel]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # One abi3 wheel must work on every interpreter it advertises, so the
        # matrix here tests that claim rather than rebuilding for each.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/download-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: dist

      - name: Install the built wheel
        shell: bash
        run: pip install --no-index --find-links dist citest

      - name: Install test dependencies
        run: pip install numpy pandas pandas-stubs pytest mypy

      - name: Type check
        working-directory: crates/citest-python
        run: mypy test/

      # Runs against the installed wheel, not a source build, so this exercises
      # what users actually receive.
      - name: Run tests
        run: pytest crates/citest-python/test/
